<!doctype html>
<html lang="{{ site.data.content.site.language | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.data.content.site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.data.content.site.description }}">
    <meta name="color-scheme" content="light dark">
    <meta property="og:title" content="{{ page.title | default: site.data.content.site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.data.content.site.description }}">
    <meta property="og:image" content="{{ site.data.content.site.share_image | relative_url }}">
    <link rel="icon" href="{{ site.data.content.site.favicon | relative_url }}">
    <script>
      (function () {
        var stored;
        try { stored = localStorage.getItem('theme'); } catch (error) {}
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/site.css?v=18' | relative_url }}">
  </head>
  <body class="page-{{ page.page_class | default: 'default' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include navigation.html %}
    <main id="main-content">
      {{ content }}
    </main>
    {% include footer.html %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    {% if page.laser_game %}
      <script type="module" src="{{ '/assets/js/laser-game.js' | relative_url }}"></script>
    {% endif %}
    {% if page.donkey_kong_game %}
      <script type="module" src="{{ '/assets/js/donkey-kong-game.js' | relative_url }}"></script>
    {% endif %}
    {% if page.imu_sandbox_game %}
      <script src="{{ '/assets/js/imu-sandbox-fallback.js?v=17' | relative_url }}" defer></script>
      <script src="{{ '/assets/js/imu-sandbox-bootstrap.js?v=17' | relative_url }}" data-module="{{ '/assets/js/imu-sandbox-game.js?v=17' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
