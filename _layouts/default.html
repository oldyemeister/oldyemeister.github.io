<!doctype html>
<html lang="{{ site.data.content.site.language | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{{ page.title | default: site.data.content.site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.data.content.site.description }}">
    <meta name="color-scheme" content="light dark">
    <meta property="og:title" content="{{ page.title | default: site.data.content.site.title }}">
    <meta property="og:description" content="{{ page.description | default: site.data.content.site.description }}">
    <meta property="og:image" content="{{ page.hero_image | default: site.data.content.site.share_image | absolute_url }}">
    <meta property="og:type" content="{{ page.og_type }}">
    <meta property="og:url" content="{{ page.url | absolute_url }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="icon" href="{{ site.data.content.site.favicon | relative_url }}" type="image/svg+xml">
    <link rel="icon" href="{{ site.data.content.site.favicon_png | relative_url }}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{{ site.data.content.site.apple_touch_icon | relative_url }}">
    <script>
      (function () {
        var stored;
        try { stored = localStorage.getItem('theme'); } catch (error) {}
        var theme = stored === 'light' || stored === 'dark'
          ? stored
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
      }());
    </script>
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/ribbon-menu.css' | relative_url }}">
  </head>
  <body class="page-{{ page.page_class | default: 'default' }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include navigation.html %}
    <main id="main-content" tabindex="-1">
      {{ content }}
    </main>
    {% include footer.html %}
    {% if page.content_key %}<script type="application/json" id="game-start-labels">{{ site.data.content.ui.game_start | jsonify }}</script>{% endif %}
    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
    <script src="{{ '/assets/js/ribbon-menu.js' | relative_url }}" defer></script>
    {% if page.laser_game %}
      <script src="{{ '/assets/js/project-bootstrap.js' | relative_url }}" data-target="[data-laser-canvas]" data-module="{{ '/assets/js/laser-game.js' | relative_url }}" defer></script>
    {% endif %}
    {% if page.donkey_kong_game %}
      <script src="{{ '/assets/js/project-bootstrap.js' | relative_url }}" data-target="[data-donkey-kong-canvas]" data-module="{{ '/assets/js/donkey-kong-game.js' | relative_url }}" defer></script>
    {% endif %}
    {% if page.imu_sandbox_game %}
      <script src="{{ '/assets/js/imu-sandbox-fallback.js' | relative_url }}" defer></script>
      <script src="{{ '/assets/js/imu-sandbox-bootstrap.js' | relative_url }}" data-module="{{ '/assets/js/imu-sandbox-game.js' | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
