imu_sandbox:
  page_title: "IMU Sandbox"
  description: "A tilt-controlled STM32 sandbox running up to 3,000 sand particles at approximately 30 FPS from BNO055 orientation data."
  objective: "Tilt the board to shift gravity. Try different materials, planets, and effects."
  notes_heading: "Inside the sandbox"
  metrics:
    - value: "3,000"
      label: "sand particles"
    - value: "≈30 FPS"
      label: "simulation rate"
    - value: "1 KB"
      label: "occupancy grid"
    - value: "0.16g–2.5g"
      label: "gravity range"
  overview: "An STM32F446ZE reads BNO055 tilt data and drives two 128 × 64 OLEDs: one for particles, one for settings. The sandbox supports sand and rock, four effect modes, and three planetary gravity presets."
  contribution_heading: "Contribution"
  contribution: "I built the Q8 fixed-point particle engine, 1 KB occupancy grid, and optimized collisions. I also implemented rock, Wind, Shake, and Explosion behavior, tuned the hardware, and helped with the 3D-printed assembly."
  performance_heading: "Performance and next iteration"
  results: "Blocking 1,024-byte OLED transfers on the shared 400 kHz I²C bus limit performance. SPI, partial redraws, DMA, and separate physics and display rates are the next improvements."
  instructions: "I developed the Q8 fixed-point particle structures, 1 KB bit-packed occupancy grid, and optimized collision engine that support up to 3,000 sand particles at approximately 30 FPS. I also added the larger-particle rock behavior and the Wind, Shake, and Explosion effects, then tuned and debugged their interactions on the assembled hardware."
  collaborator:
    prefix: "Built with"
    name: "Suzen Bao"
    url: "https://www.linkedin.com/in/suzen-bao/"
  source_label: "View original source"
  source_url: "https://github.com/oldyemeister/imu_sandbox_stm32"
  back_label: "Back to projects"
  interactive_label: "Interactive OLED model"
