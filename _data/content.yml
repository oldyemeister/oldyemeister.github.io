laser:
  page_title: "Laser Puzzle"
  description: "A mirror-and-laser puzzle built for the DE1-SoC's RISC-V environment."
  objective: "Rotate mirrors to hit every target before time runs out. Avoid the hazards."
  notes_heading: "Behind the puzzle"
  overview: "The original game uses a 320 × 240 VGA framebuffer, 13 mirrors, six targets, four hazards, two lives, and a two-minute timer. Integer coordinates keep beam reflections, collisions, and rendering in sync."
  results: "I separated geometry, timing, and game state to make the mechanics testable and reproduce them in this browser version. The key lesson: a one-pixel error can change the entire reflection path."
  instructions: "Select a mirror, rotate it to reflect the beam, and route the laser to every target within the time limit."
  controls_heading: "Controls"
  keyboard_controls: "Up and Down select a mirror. Left and Right rotate it. Space pauses. R resets."
  keyboard_guide:
    - keys: "↑ ↓"
      action: "Select"
    - keys: "← →"
      action: "Rotate"
    - keys: "Space"
      action: "Pause"
    - keys: "R"
      action: "Reset"
  source_label: "View original source"
  source_url: "https://github.com/oldyemeister/RISC-V_lasergame"
  back_label: "Back to projects"
  reset_label: "Reset puzzle"
  pause_label: "Pause puzzle"
  resume_label: "Resume puzzle"
  implementation_note: "Web version built with JavaScript and Canvas."
  status_labels:
    selected: "Mirror No."
    timer: "Time"
    lives: "Lives"
    targets: "Targets"
    ready: "Redirect the laser to begin."
    won: "Mission complete. All nodes destroyed."
    lost: "Mission failed. Reset to try again."
    paused: "Puzzle paused."

donkey_kong:
  page_title: "Donkey Kong FPGA Game"
  eyebrow: "Hardware-implemented classic game"
  description: "Donkey Kong rebuilt in Verilog on a DE1-SoC FPGA, with game logic and graphics running in custom circuits."
  objective: "Reach the goal at the top of the level while avoiding barrels."
  source_note: "Source code is private under U of T course policy because it includes instructor-provided code."
  overview: "Clocked Verilog logic handles movement, jumping, barrels, collisions, and win conditions. A VGA pipeline combines memory-backed sprites with live player and barrel positions."
  results: "The FPGA design runs at 60 FPS. Building it strengthened my skills in synchronous logic, clock division, graphics memory, and timing analysis—especially making simultaneous movement and collisions deterministic."
  instructions: "Move and jump to climb the platforms, dodging barrels along the way."
  notes_heading: "Behind the game"
  collaborator:
    prefix: "Built with"
    name: "Nolan Young"
    url: "https://www.linkedin.com/in/nolany/"
  controls_heading: "Controls"
  keyboard_controls: "A and D or Left and Right move. W or Up jumps. Space pauses. R resets."
