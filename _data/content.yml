about:
  heading: "About"
  biography: |-
    I'm a Computer Engineering student at the University of Toronto (BASc + PEY Co-op, expected graduation April 2027), with a dual hardware-software background spanning embedded systems, RF/PCB design, and AI product engineering. I was named to the Dean's Honor List in Spring 2024 and Spring 2025.

    My internship experience includes AI engineering work at Tencent Cloud and BesTV (Shanghai Media Group), building LLM-powered workflows, translation APIs, and speech processing pipelines. On the hardware side, I've designed RF downconversion PCBs in Altium, built FPGA games in Verilog and C on the DE1-SoC, and worked with STM32 embedded systems. I'm also a content creator on Bilibili, producing technical videos on Formula 1 engineering and motorsport technology for an audience of 10,000+ followers.
