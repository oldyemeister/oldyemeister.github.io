imu_sandbox:
  page_title: "IMU Sandbox"
  eyebrow: "STM32 + BNO055 sensor demo"
  description: "A tilt-controlled particle sandbox built on the STM32, where sand and rock particles fall and collide in real time based on the board's physical orientation."
  objective: "Tilt the board to shift gravity and watch particles respond in real time. Switch between materials, gravity presets, and environmental effects."
  notes_heading: "From sensor to display"
  overview: "IMU Sandbox is a handheld STM32F446ZE particle simulator that turns BNO055 orientation readings into a gravity vector for sand and rock particles on a 128 × 64 OLED. A second OLED reports material, mode, planet, and gravity state, while a 3D-printed enclosure brings the sensor, controls, and displays into one physical device. I developed the particle data structures, bit-packed occupancy grid, fixed-point motion and collision engine, and the Wind, Shake, and Explosion effects, while also contributing to enclosure assembly, tuning, debugging, and system testing."
  results: "The completed system simulates as many as 3,000 particles at approximately 30 FPS and responds directly to physical rotation under Moon, Earth, and Jupiter gravity presets. The work taught me how to trade numerical precision, memory use, and update cost on a microcontroller, and how to reason carefully about IMU and display coordinate systems. Integrating the full device also reinforced that embedded performance is system-wide: sensor transforms, collision behavior, I2C framebuffer transfers, and mechanical assembly all affect how convincing the final interaction feels."
  instructions: "I developed the core particle simulation: the data structures, occupancy grid, and fixed-point physics engine that drives how sand and rock particles fall and collide, adapting ideas from an open-source falling-sand engine (The Powder Toy) for embedded hardware. I extended the engine with rock material behavior and the wind, shake, and explosion effects, and handled collision tuning, 3D-printed hardware assembly, and debugging of material/effect interactions."
  collaborator:
    prefix: "Built with"
    name: "Suzen Bao"
    url: "https://www.linkedin.com/in/suzen-bao/"
  source_label: "View original source"
