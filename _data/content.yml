imu_sandbox:
  page_title: "IMU Sandbox"
  eyebrow: "STM32 + BNO055 sensor demo"
  description: "A tilt-controlled STM32 sandbox running up to 3,000 sand particles at approximately 30 FPS from BNO055 orientation data."
  objective: "Tilt the board to shift gravity and watch particles respond in real time. Switch between materials, gravity presets, and environmental effects."
  notes_heading: "Embedded physics at 3,000 particles"
  metrics:
    - value: "3,000"
      label: "sand particles"
    - value: "≈30 FPS"
      label: "simulation rate"
    - value: "1 KB"
      label: "occupancy grid"
    - value: "0.16g–2.5g"
      label: "gravity range"
  overview: "We implemented a handheld STM32F446ZE particle sandbox controlled by BNO055 roll and pitch data. One 128 × 64 OLED renders the simulation, while a second displays the material, effect mode, planet, and gravity level. Users can select sand or rock, four environmental modes, and Moon (0.16g), Earth (1.0g), or Jupiter (2.5g) gravity."
  contribution_heading: "contribution"
  contribution: "I developed the particle data structures, 1 KB bit-packed occupancy grid, and core collision logic. Particle position and velocity use Q8 fixed-point values, avoiding floating-point work in the main update loop. Constant-time grid checks, inactive-particle skipping, velocity limits, and two gravity-relative fallback cells keep collision processing efficient. I also implemented rock behavior, Wind, Shake, and Explosion effects, parameter tuning, debugging, and part of the 3D-printed assembly."
  performance_heading: "Performance and next iteration"
  results: "The system runs up to 3,000 sand particles at approximately 30 FPS. Its main bottleneck is the OLED interface: each frame sends a complete 1,024-byte framebuffer through blocking transfers on the 400 kHz I²C bus shared with the IMU. A future version could use SPI, partial redraws, DMA, and separate physics and display rates to improve performance."
  instructions: "I developed the Q8 fixed-point particle structures, 1 KB bit-packed occupancy grid, and optimized collision engine that support up to 3,000 sand particles at approximately 30 FPS. I also added the larger-particle rock behavior and the Wind, Shake, and Explosion effects, then tuned and debugged their interactions on the assembled hardware."
  collaborator:
    prefix: "Built with"
    name: "Suzen Bao"
    url: "https://www.linkedin.com/in/suzen-bao/"
