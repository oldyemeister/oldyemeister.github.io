laser:
  page_title: "Laser Puzzle"
  eyebrow: "FPGA laser reflection game"
  description: "A laser reflection puzzle originally built for the DE1-SoC FPGA board. Rotate mirrors to redirect the laser and hit every target before time runs out."
  objective: "Destroy all target nodes by redirecting the laser beam using rotatable mirrors, without hitting hazards."
  notes_heading: "From low-level graphics to a complete game"
  overview: "Laser Puzzle is a complete game designed for the DE1-SoC's RV32 environment, combining a 320 × 240 VGA framebuffer with an interactive ray-reflection challenge. The project brings together 13 selectable mirrors, continuous beam tracing, six destructible target nodes, four hazards, a two-life system, and a two-minute timer in one deterministic game loop. I built the gameplay around integer framebuffer coordinates so the visual beam, mirror geometry, collisions, controls, and HUD remain synchronized on the target platform."
  results: "The result is a self-contained puzzle that runs as a low-level hardware-oriented application and is also playable here as a faithful browser recreation. Building it taught me how much precision matters when graphics double as collision data: a one-pixel offset can change an entire reflection path. I also learned to separate game state, geometry, timing, and rendering clearly, which made the original mechanics easier to test and reproduce across platforms."
  instructions: "Select a mirror, rotate it to reflect the beam, and route the laser to every target within the time limit."
  controls_heading: "Controls"
  keyboard_controls: "Up and Down select a mirror. Left and Right rotate it. Space pauses. R resets."
  source_label: "View original source"
  source_url: "https://github.com/oldyemeister/RISC-V_lasergame"
  back_label: "Back to projects"
  reset_label: "Reset puzzle"
  pause_label: "Pause puzzle"
  resume_label: "Resume puzzle"
  implementation_note: "Web version built with JavaScript and Canvas."
