    lives: "Lives"
    targets: "Targets"
    ready: "Redirect the laser to begin."
    won: "Mission complete. All nodes destroyed."
    lost: "Mission failed. Reset to try again."
    paused: "Puzzle paused."

donkey_kong:
  page_title: "Donkey Kong FPGA Game"
  eyebrow: "Hardware-implemented classic game"
  description: "A full hardware recreation of Donkey Kong, built entirely in Verilog on a DE1-SoC FPGA — game logic, sprite rendering, and collision detection all run in custom digital circuits."
  objective: "Reach the goal at the top of the level while avoiding barrels."
  overview: "This project is a hardware recreation of Donkey Kong developed with Nolan Young for the DE1-SoC. Instead of running a software game loop, the player movement, jumping, barrel behavior, collision detection, sprite selection, and win logic are expressed as clocked Verilog logic. The level and sprites are stored in FPGA memory, while the VGA pipeline continuously combines those assets with the live positions of Mario and the barrels."
  results: "The finished design delivers smooth 60 FPS VGA gameplay with responsive controls, moving hazards, collision-based respawning, and a complete path to the goal. The project strengthened my understanding of synchronous design, clock-rate division, memory-backed graphics, and timing analysis. It also showed me how edge cases that are trivial in software—platform boundaries, simultaneous movement, and collision timing—must be made explicit and deterministic in hardware."
  instructions: "Move and jump to climb the platforms, dodging barrels along the way."
  notes_heading: "From design to gameplay"
  collaborator:
    prefix: "Built with"
    name: "Nolan Young"
    url: "https://www.linkedin.com/in/nolany/"
  controls_heading: "Controls"
  keyboard_controls: "A and D or Left and Right move. W or Up jumps. Space pauses. R resets."
  keyboard_guide:
    - keys: "← →"
      action: "Move"
    - keys: "↑"
      action: "Jump"
    - keys: "Space"
      action: "Pause"
    - keys: "R"
