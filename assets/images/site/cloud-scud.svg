<svg xmlns="http://www.w3.org/2000/svg" width="260" height="140" viewBox="0 0 260 140">
  <defs>
    <filter id="edge" x="0" y="0" width="260" height="140" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".03 .045" numOctaves="2" seed="91" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="38" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
    <linearGradient id="shade" x2=".2" y2="1">
      <stop stop-color="#f8fbff" stop-opacity=".85"/><stop offset=".55" stop-color="#dce7f0" stop-opacity=".65"/><stop offset="1" stop-color="#abc0d0" stop-opacity=".2"/>
    </linearGradient>
  </defs>
  <g filter="url(#edge)" fill="url(#shade)">
    <ellipse cx="94" cy="82" rx="59" ry="19" transform="rotate(-12 94 82)"/>
    <ellipse cx="128" cy="62" rx="41" ry="29"/>
    <ellipse cx="178" cy="74" rx="32" ry="17"/>
    <ellipse cx="217" cy="85" rx="17" ry="9" opacity=".55"/>
    <ellipse cx="52" cy="99" rx="23" ry="8" opacity=".4"/>
  </g>
</svg>
